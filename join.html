<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대리톡 테스트 참여</title>
<meta property="og:title" content="대리톡 테스트 참여">
<meta property="og:description" content="테스터 모집이 끝났습니다">
<meta property="og:image" content="https://bcf-soft.github.io/daeritalk-web/icon.png">
<style>
  :root { --bg:#130f38; --card:#1f1a52; --line:#2f2970; --text:#fff; --muted:#b9b6d8; --accent:#fdd456; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif; max-width: 480px; margin: 0 auto; padding: 28px 16px 48px; line-height: 1.5; }
  .top { display:flex; align-items:center; gap:16px; margin-bottom: 18px; }
  .top img { width:64px; height:64px; border-radius:16px; }
  .top h1 { margin:0; font-size:32px; color:var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px 16px; }
  .card h2 { margin:0 0 10px; font-size:22px; }
  .card p { margin:8px 0 0; font-size:17px; color:var(--muted); }
</style>
</head>
<body>
<div class="top"><img src="icon.png" alt=""><h1>대리톡</h1></div>
<div class="card">
  <h2>테스터 모집이 끝났습니다</h2>
  <p>참여해 주셔서 감사합니다.</p>
  <p>이미 참여하신 기사님은 플레이 스토어에서 대리톡을 그대로 쓰시고 업데이트하시면 됩니다.</p>
</div>
</body>
</html>
